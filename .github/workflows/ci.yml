name: Plugin CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Build generated package artifacts
        run: npm run build

      - name: Run the complete repository check
        run: npm run check

  pi-cli:
    name: Real Pi CLI regression
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Run research-suite through Pi 1.1.0 and latest
        env:
          PI_CLI_VERSIONS: 1.1.0,latest
          RESEARCH_SUITE_PACKAGE: '@gyoungwe/research-suite@0.1.3'
          RESEARCH_SUITE_LEGACY_PACKAGE: '@gyoungwe/research-suite@0.1.1'
          REQUIRE_LEGACY_REGRESSION: '1'
          PI_CLI_EVIDENCE: artifacts/pi-cli-regression.json
        run: npm run smoke:pi-cli

      - name: Upload Pi CLI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-cli-regression-evidence
          path: artifacts/pi-cli-regression.json
          if-no-files-found: warn
